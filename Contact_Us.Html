<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact_Us </title>
</head>
<body style="background-color: #e0ebf6;font-family: Arial;">
    <h1 style="background-color:#071d35;color:white;
        text-align:center;padding 25px;">
        Contact Our Library
    </h1>
    <nav style="text-align: center;background-color: #1047b8;padding: 15px;">   
    </nav>
    <h2>Get In Touch</h2>
    <p><b><Address:</b>Our Library,Kenya</p>
    <p><b>Email:</b>library@Wotetti.com</p>
    <p><b>Phone:</b>0796735850</p>
    <h2>Contact Form:</h2>
    <form>
        <label>Full Name:</label><br>
        <input type="text"name="fullname"
        placeholder="Enter your full name"required><br><br>
        <label>Subject:</label><br>
        <input type="text"name="subject"
        placeholder="Enter subject"><br><br>
        <label>Message:</label><br>
        <textarea name="message" rows="5"cols="35"
        placeholder="Write your message"></textarea><br><br>
        <input type="Submit"value="Send Message">
        <input type="Reset"value="Clear">
    </form>
    <footer style="background-color: #071d35;color: white;
    text-align: center;padding: 15px;margin-top: 25px;">
    <p>&copy;2026 Library Management System</p>
</footer>  
</body>
</html>
